<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Fox Loop: Portal Edition</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: radial-gradient(circle, #1c1f2b, #0d0f16);
      font-family: 'Arial', sans-serif;
    }
    canvas {
      display: block;
      margin: 0 auto;
    }
    #score {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 24px;
      font-weight: bold;
      color: #fff;
      text-shadow: 2px 2px #000;
    }
    #overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      background: rgba(0, 0, 0, 0.6);
      color: #fff;
      font-size: 28px;
      display: none;
    }
    #startBtn {
      margin-top: 20px;
      padding: 10px 20px;
      background: #ff9f43;
      border: none;
      border-radius: 10px;
      font-size: 20px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="score">Score: 0</div>
  <div id="overlay">
    <div>Fox Loop</div>
    <button id="startBtn">Start</button>
  </div>
  <canvas id="gameCanvas" width="480" height="640"></canvas>
  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const scoreDisplay = document.getElementById("score");
    const overlay = document.getElementById("overlay");
    const startBtn = document.getElementById("startBtn");

    // ИЗОБРАЖЕНИЯ
    const foxImg = new Image();
    foxImg.src = "https://i.imgur.com/SlbGaY1.png";

    const ringImg = new Image();
    ringImg.src = "https://imgur.com/q9YrUAf";

    let foxY = 250;
    let velocity = 0;
    const gravity = 0.5;
    const jump = -8;
    let rings = [];
    let score = 0;
    let gameOver = false;

    function getDifficulty(score) {
      if (score < 10) return { speed: 2, tolerance: 40 };
      if (score < 20) return { speed: 3, tolerance: 35 };
      if (score < 30) return { speed: 4, tolerance: 30 };
      return { speed: 5, tolerance: 28 };
    }

    function resetGame() {
      foxY = 250;
      velocity = 0;
      rings = [];
      score = 0;
      gameOver = false;
    }

    function drawFox() {
      ctx.drawImage(foxImg, 80, foxY, 50, 50);
    }

    function createRing() {
      const centerY = Math.floor(Math.random() * (canvas.height - 200)) + 100;
      rings.push({ x: canvas.width, y: centerY });
    }

    function drawRings() {
      const { speed, tolerance } = getDifficulty(score);
      for (let i = rings.length - 1; i >= 0; i--) {
        const ring = rings[i];
        ctx.drawImage(ringImg, ring.x - 40, ring.y - 40, 80, 80);
        ring.x -= speed;

        const foxCenterX = 80 + 25;
        const foxCenterY = foxY + 25;
        const dx = foxCenterX - ring.x;
        const dy = foxCenterY - ring.y;
        const dist = Math.sqrt(dx * dx + dy * dy);

        if (dist > tolerance && ring.x < foxCenterX && !ring.passed) {
          gameOver = true;
          overlay.style.display = "flex";
        }

        if (!ring.passed && ring.x + 40 < foxCenterX) {
          ring.passed = true;
          score++;
        }
      }
    }

    function gameLoop() {
      if (gameOver) return;

      ctx.clearRect(0, 0, canvas.width, canvas.height);
      velocity += gravity;
      foxY += velocity;

      drawFox();
      drawRings();

      scoreDisplay.textContent = `Score: ${score}`;
      requestAnimationFrame(gameLoop);
    }

    setInterval(() => {
      if (!gameOver) createRing();
    }, 1600);

    function startGame() {
      overlay.style.display = "none";
      resetGame();
      requestAnimationFrame(gameLoop);
    }

    startBtn.addEventListener("click", startGame);
    document.addEventListener("keydown", (e) => {
      if (e.code === "Space") velocity = jump;
    });
    document.addEventListener("touchstart", () => velocity = jump);

    foxImg.onload = () => {
      overlay.style.display = "flex";
    };
  </script>
</body>
</html>
