<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fox Loop</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: radial-gradient(circle, #1c1f2b, #0d0f16);
      font-family: 'Arial', sans-serif;
    }
    canvas {
      display: block;
      margin: 0 auto;
    }
    #score {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 24px;
      font-weight: bold;
      color: #fff;
      text-shadow: 2px 2px #000;
    }
    #overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      background: rgba(0, 0, 0, 0.6);
      color: #fff;
      font-size: 28px;
      display: none;
    }
    #startBtn {
      margin-top: 20px;
      padding: 10px 20px;
      background: #ff9f43;
      border: none;
      border-radius: 10px;
      font-size: 20px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="score">Score: 0</div>
  <div id="overlay">
    <div>Fox Loop</div>
    <button id="startBtn">Start</button>
  </div>
  <canvas id="gameCanvas" width="480" height="640"></canvas>
  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const scoreDisplay = document.getElementById("score");
    const overlay = document.getElementById("overlay");
    const startBtn = document.getElementById("startBtn");

    let foxY = 250;
    let velocity = 0;
    const gravity = 0.5;
    const jump = -8;
    const foxImg = new Image();
    foxImg.src = "https://i.imgur.com/RzG0TGW.png"; // заменим позже на 3D рендер

    const pipes = [];
    let score = 0;
    let gameOver = false;

    function resetGame() {
      foxY = 250;
      velocity = 0;
      pipes.length = 0;
      score = 0;
      gameOver = false;
    }

    function drawFox() {
      ctx.drawImage(foxImg, 80, foxY, 40, 40);
    }

    function createPipe() {
      const gap = 140;
      const topHeight = Math.floor(Math.random() * 300) + 50;
      pipes.push({ x: canvas.width, top: topHeight, bottom: topHeight + gap });
    }

    function drawPipes() {
      ctx.fillStyle = "#1cc88a";
      for (let pipe of pipes) {
        ctx.fillRect(pipe.x, 0, 50, pipe.top);
        ctx.fillRect(pipe.x, pipe.bottom, 50, canvas.height);
        pipe.x -= 2;

        if (pipe.x + 50 === 80) score++;

        if (
          (80 + 40 > pipe.x && 80 < pipe.x + 50 &&
            (foxY < pipe.top || foxY + 40 > pipe.bottom)) ||
          foxY > canvas.height || foxY < 0
        ) {
          gameOver = true;
          overlay.style.display = "flex";
        }
      }
    }

    function gameLoop() {
      if (gameOver) return;

      ctx.clearRect(0, 0, canvas.width, canvas.height);
      velocity += gravity;
      foxY += velocity;

      drawFox();
      drawPipes();

      scoreDisplay.textContent = `Score: ${score}`;

      requestAnimationFrame(gameLoop);
    }

    setInterval(() => {
      if (!gameOver) createPipe();
    }, 1800);

    function startGame() {
      overlay.style.display = "none";
      resetGame();
      requestAnimationFrame(gameLoop);
    }

    startBtn.addEventListener("click", startGame);
    document.addEventListener("keydown", (e) => {
      if (e.code === "Space") velocity = jump;
    });
    document.addEventListener("touchstart", () => velocity = jump);

    foxImg.onload = () => {
      overlay.style.display = "flex";
    };
  </script>
</body>
</html>
